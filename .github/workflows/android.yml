name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o pubg-clone-v1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: cd pubg-clone && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pubg-clone-apk
          path: pubg-clone/app/build/outputs/apk/debug/app-debug.apk
